spring.application.name=Java Lab
server.address=127.0.0.1
server.port=10081
server.error.include-message=always
spring.jackson.serialization.indent-output=true
spring.web.resources.cache.period=0
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
lab.data-dir=${LAB_DATA_DIR:data}
lab.ai.api-key=${AI_API_KEY:}
lab.ai.model=${AI_MODEL:}
lab.ai.api-url=${AI_API_URL:https://openrouter.ai/api/v1}
lab.ai.openrouter-provider-sort=${AI_OPENROUTER_PROVIDER_SORT:throughput}
lab.ai.timeout=${AI_TIMEOUT:300s}
lab.ai.max-tokens=${AI_MAX_TOKENS:128000}
lab.ai.tools-enabled=${AI_TOOLS_ENABLED:true}
lab.ai.max-tool-rounds=${AI_MAX_TOOL_ROUNDS:16}
lab.ai.max-tool-calls=${AI_MAX_TOOL_CALLS:64}
